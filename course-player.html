<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Player | MediWise Academy</title><meta name="description" content="Interactive MediWise Academy course player."><link rel="stylesheet" href="style.css"></head><body><nav class="nav"><div class="wrap navin"><a class="brand" href="index.html"><img src="assets/mediwise-logo.png" alt="">MEDIWISE</a><div class="links"><a href="academy.html">Academy</a><a href="study-dashboard.html">Dashboard</a><a href="quiz.html">Quiz</a><a href="flashcards.html">Flashcards</a></div></div></nav><main class="section"><div class="wrap" id="app"></div></main><footer><div class="wrap footerin"><strong>MEDIWISE — Learn • Verify • Empower</strong><span>Educational learning only • Kabilla Andrew</span></div></footer><script src="learning-engine.js"></script><script>
const key=new URLSearchParams(location.search).get('course')||'anatomy';const course=MEDIWISE_COURSES[key]||MEDIWISE_COURSES.anatomy;const app=document.getElementById('app');let p=mwGetProgress();p[key]=p[key]||{completed:[],scores:{}};let current=0;
function render(){const done=p[key].completed.length;app.innerHTML=`<div class="breadcrumb"><a href="academy.html">Academy</a> / ${course.title}</div><div class="eyebrow">${course.tag}</div><h1>${course.title}</h1><p class="lead">${course.desc}</p><div class="course-meta"><div><strong>${done}/${course.modules.length}</strong><span>modules completed</span></div><div><strong>${Math.round(done/course.modules.length*100)}%</strong><span>course progress</span></div><div><strong>${course.modules.length*3}</strong><span>practice questions</span></div></div><div class="progressbar"><span style="width:${done/course.modules.length*100}%"></span></div><div class="course-layout"><aside class="module-list"><h3>Modules</h3>${course.modules.map((m,i)=>`<button class="module-btn ${i===current?'active':''} ${p[key].completed.includes(i)?'done':''}" onclick="openModule(${i})"><span>${i+1}</span>${m[0]} ${p[key].completed.includes(i)?'✓':''}</button>`).join('')}</aside><section id="module"></section></div>`;openModule(current)}
function openModule(i){current=i;renderModule();document.querySelectorAll('.module-btn').forEach((b,j)=>b.classList.toggle('active',j===i))}
function renderModule(){const m=course.modules[current];const questions=[
 {q:m[2],opts:[m[3],'It cannot be explained scientifically','Only specialists can answer it','It has no practical relevance'],a:0},
 {q:'Which approach best supports safe learning?',opts:['Use current guidance and verify important claims','Assume every online claim is true','Ignore uncertainty','Use one source for every question'],a:0},
 {q:'What is a good study action after this module?',opts:['Recall the key idea and explain it in your own words','Read it once and never revisit it','Skip practice','Memorize without understanding'],a:0}];let qIndex=0,score=0;const box=document.getElementById('module');box.innerHTML=`<article class="article-block"><span class="tag">MODULE ${current+1} OF ${course.modules.length}</span><h2>${m[0]}</h2><p>${m[1]}</p><div class="learning-note"><strong>Core idea:</strong> ${m[3]}</div><h3>Quick check</h3><div id="question"></div><div class="quiz-actions"><button class="btn" id="nextQ">Start question</button><span id="qstatus" class="small"></span></div><div id="feedback"></div></article>`;const q=document.getElementById('question'),next=document.getElementById('nextQ'),status=document.getElementById('qstatus'),feedback=document.getElementById('feedback');function show(){if(qIndex>=questions.length){const pct=Math.round(score/questions.length*100);mwMark(key,current,pct);p=mwGetProgress();feedback.innerHTML=`<div class="result-card"><h3>Module complete 🎉</h3><p>Score: <strong>${score}/${questions.length}</strong> (${pct}%).</p><p>${pct>=80?'Strong performance.':'Review this module and try again.'}</p><button class="btn" onclick="nextModule()">${current<course.modules.length-1?'Next module →':'Finish course →'}</button></div>`;next.style.display='none';return}const item=questions[qIndex];status.textContent=`Question ${qIndex+1}/${questions.length}`;q.innerHTML=`<p><strong>${item.q}</strong></p>${item.opts.map((o,i)=>`<button class="choice" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}`;feedback.innerHTML='';next.style.display='none'}window.answer=(i)=>{const item=questions[qIndex];document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');if(j===i&&i!==item.a)b.classList.add('wrong')});if(i===item.a)score++;feedback.innerHTML=`<div class="answer-note"><strong>${i===item.a?'Correct ✓':'Review'}</strong> — ${item.opts[item.a]}</div>`;qIndex++;next.textContent=qIndex===questions.length?'See result':'Next question';next.style.display='inline-block'};next.onclick=()=>{if(qIndex<questions.length)show()};show()}
window.nextModule=()=>{if(current<course.modules.length-1){current++;renderModule()}else{location.href='study-dashboard.html'}};render();
</script></body></html>
