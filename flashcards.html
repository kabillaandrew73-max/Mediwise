<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="MediWise — Learn, Verify, Empower. Evidence-informed health education and student learning."><title>Flashcards | MediWise</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html">MEDIWISE</a><nav><a href="index.html">Home</a><a href="health.html">Health</a><a href="med.html">Med</a><a href="nutrition.html">Nutrition</a><a href="facts.html">Facts</a><a href="academy.html">Academy</a></nav></div></header><main class="container section"><div class="eyebrow">MEDIWISE ACADEMY</div><h1>Flashcards</h1><p>Tap a card to reveal the answer. Use these for active recall, then verify details against your course materials.</p><div class="flash-card flash" id="card">Loading…</div><p id="count" class="small-note"></p><p><button class="btn" id="prev">Previous</button> <button class="btn" id="next">Next</button></p></main><footer class="site-footer"><div class="container">Learn • Verify • Empower — Kabilla Andrew, Founder</div></footer><script>const cards=[['Anatomical position','Standing upright, facing forward, arms by sides, palms forward.'],['Homeostasis','Maintenance of relatively stable internal conditions.'],['Pharmacokinetics','What the body does to a drug: absorption, distribution, metabolism, excretion.'],['Pharmacodynamics','What a drug does to the body, including effects and mechanisms.'],['Primary prevention','Actions intended to prevent disease before it occurs.'],['Health literacy','Ability to access, understand, appraise and use health information and services.'],['Antibiotic','A medicine used against susceptible bacterial infections; not a treatment for viral infections.'],['Blood pressure','The force of circulating blood against arterial walls, commonly expressed as systolic/diastolic pressure.'],['BMI','A weight-for-height index used at population and individual level with limitations; it is not a direct measure of body fat.'],['Cross-sectional study','A study measuring exposure and outcome at a particular point or period in time.']];let i=0,front=true;const c=document.getElementById('card'),cnt=document.getElementById('count');function render(){c.textContent=front?cards[i][0]:cards[i][1];cnt.textContent=(i+1)+' / '+cards.length+' — click card to flip';}c.onclick=()=>{front=!front;render()};document.getElementById('next').onclick=()=>{i=(i+1)%cards.length;front=true;render()};document.getElementById('prev').onclick=()=>{i=(i-1+cards.length)%cards.length;front=true;render()};render();</script></body></html>
